name: rotas-nordestinas-managed
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public portal URL}
    ports: ["3000:3000"]
    environment:
      API_GATEWAY_URL: http://gateway:5000
      PORT: 3000
    depends_on:
      gateway: { condition: service_healthy }

  gateway:
    build: ../backend
    command: ["node", "src/gateway/server.js"]
    environment:
      PORT: 5000
      IDENTITY_SERVICE_URL: http://identity:3001
      DESTINATIONS_SERVICE_URL: http://destinations:3002
    depends_on:
      identity: { condition: service_healthy }
      destinations: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  identity:
    build: ../backend
    command: ["node", "src/services/identity-server.js"]
    environment:
      PORT: 3001
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?Set a private managed PostgreSQL URL for Identity}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set an internal service token}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  destinations:
    build: ../backend
    command: ["node", "src/services/destinations-server.js"]
    environment:
      PORT: 3002
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?Set a private managed PostgreSQL URL for Destinations}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT secret}
      IDENTITY_SERVICE_URL: http://identity:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set an internal service token}
    depends_on:
      identity: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
